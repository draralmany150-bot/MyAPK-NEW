name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK path
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Fix SDK manager path
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$(command -v sdkmanager)" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 Cython==0.29.37

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAPK
          path: bin/*.apk
